<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Perfil Laboral para IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-5xl mx-auto px-5 py-10">
    <section class="mb-10">
      <span class="inline-flex items-center rounded-full bg-blue-500/10 text-blue-300 px-4 py-1 text-sm font-medium mb-4">
        Orientación laboral asistida por IA
      </span>

      <h1 class="text-4xl md:text-5xl font-bold tracking-tight mb-4">
        Generador de briefing laboral
      </h1>

      <p class="text-slate-300 text-lg max-w-3xl leading-relaxed">
        Completá las respuestas y generá un prompt estructurado para pegar en ChatGPT, Claude, Gemini o cualquier agente de IA.
      </p>
    </section>

    <section class="grid gap-5" id="formulario">

      <!-- REQUIRED -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <label for="nombre" class="block text-lg font-semibold mb-2">Nombre o referencia *</label>
        <input id="nombre" required type="text" class="campo w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: Juan" />
        <p class="text-red-400 text-sm mt-2 hidden" id="error-nombre">Campo obligatorio</p>
      </div>

      <!-- REQUIRED -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <label for="situacion" class="block text-lg font-semibold mb-2">Situación actual *</label>
        <textarea id="situacion" required rows="4" class="campo w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describe la situación"></textarea>
        <p class="text-red-400 text-sm mt-2 hidden" id="error-situacion">Campo obligatorio</p>
      </div>

      <!-- REQUIRED -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <label for="experiencia" class="block text-lg font-semibold mb-2">Experiencia laboral *</label>
        <textarea id="experiencia" required rows="4" class="campo w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <p class="text-red-400 text-sm mt-2 hidden" id="error-experiencia">Campo obligatorio</p>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <label for="fortalezas" class="block text-lg font-semibold mb-2">Fortalezas</label>
        <textarea id="fortalezas" rows="4" class="campo w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3"></textarea>
      </div>

    </section>

    <section class="mt-8 flex flex-col sm:flex-row gap-3">
      <button id="cargarBtn" class="rounded-xl bg-blue-600 hover:bg-blue-500 transition px-6 py-3 font-semibold">
        Cargar prompt
      </button>

      <button id="copiarBtn" class="hidden rounded-xl bg-slate-800 hover:bg-slate-700 transition px-6 py-3 font-semibold border border-slate-700">
        Copiar prompt
      </button>
    </section>

    <section id="resultadoWrapper" class="hidden mt-8 bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <textarea id="promptFinal" readonly rows="20" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-3"></textarea>
    </section>
  </main>

  <script>
    const requiredFields = ['nombre','situacion','experiencia'];

    function validar() {
      let valido = true;

      requiredFields.forEach(id => {
        const el = document.getElementById(id);
        const error = document.getElementById('error-' + id);

        if (!el.value.trim()) {
          valido = false;
          el.classList.add('border-red-500');
          if (error) error.classList.remove('hidden');
        } else {
          el.classList.remove('border-red-500');
          if (error) error.classList.add('hidden');
        }
      });

      return valido;
    }

    function generarPrompt() {
      return `Analizá este perfil laboral y sugerí opciones:\n\nNombre: ${nombre.value}\nSituación: ${situacion.value}\nExperiencia: ${experiencia.value}`;
    }

    const cargarBtn = document.getElementById('cargarBtn');
    const copiarBtn = document.getElementById('copiarBtn');
    const resultadoWrapper = document.getElementById('resultadoWrapper');
    const promptFinal = document.getElementById('promptFinal');

    cargarBtn.addEventListener('click', () => {
      if (!validar()) return;

      promptFinal.value = generarPrompt();
      resultadoWrapper.classList.remove('hidden');
      copiarBtn.classList.remove('hidden');
    });

    copiarBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(promptFinal.value);
      copiarBtn.textContent = 'Copiado';
      setTimeout(()=> copiarBtn.textContent = 'Copiar prompt',1500);
    });
  </script>
</body>
</html>
